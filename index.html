<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вернись к прошлому</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital@0;1&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="riddle" aria-labelledby="riddle-title">
      <h1 id="riddle-title">Чтобы начать что-то новое,<br />вернись к прошлому</h1>
      <p class="code binary">11 1 101 10011 1 10010 11 1001 10000 1000 101 10010</p>
      <p class="code cipher">C+2 0F WB</p>
      <form class="answer-form" action="#" method="get">
        <label for="answer">Ваш ответ</label>
        <input id="answer" name="answer" type="text" autocomplete="off" placeholder="Введите ответ" />
      </form>
    </main>
  </body>
</html>
